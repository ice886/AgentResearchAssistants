[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-research"
version = "0.1.0"
description = "研究 Agent 系统（Agent Laboratory 风格）：自动写实验代码、跑实验、撰写论文的多智能体系统"
requires-python = ">=3.11"
dependencies = [
    "docker>=7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
